{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-primary">Our Partnered NGOs</h2>
        <p class="text-muted">Working together to make a real impact in society.</p>
    </div>

    <div class="row g-4">
        {% for ngo in ngos %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <!-- NGO Photo -->
                <img src="{{ url_for('static', filename='images/ngo.jpg') }}" class="card-img-top" alt="{{ ngo.name }}" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column p-4">
                    <span class="badge bg-primary-subtle text-primary fw-bold w-auto mb-2 align-self-start">{{ ngo.cat }}</span>
                    <h5 class="fw-bold mb-2">{{ ngo.name }}</h5>
                    <p class="text-muted small flex-grow-1">{{ ngo.desc }}</p>
                    <p class="text-secondary small mb-3"><i class="fa-solid fa-location-dot text-danger me-1"></i> {{ ngo.location }}</p>
                    <a href="{{ url_for('donate') }}" class="btn btn-primary w-100 fw-bold rounded-3">Donate Now</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
