{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">Volunteer Duty Portal</h3>
        <p class="text-muted small mb-0">Accept pick-up tasks and upload delivery proof photos</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
        <h5 class="fw-bold mb-3">Assigned Pickups</h5>
        <div class="p-3 bg-light rounded-3 d-md-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-primary mb-1">Pickup Task #TRK1001</span>
                <h6 class="fw-bold mb-1">Food Items Pickup from Donor</h6>
                <p class="text-muted small mb-0"><i class="fa-solid fa-location-dot me-1 text-danger"></i> Location: Anna Nagar, Chennai</p>
            </div>
            <div class="mt-3 mt-md-0">
                <a href="{{ url_for('gallery') }}" class="btn btn-primary rounded-3 fw-bold btn-sm">
                    <i class="fa-solid fa-camera me-1"></i> Upload Photo Proof
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
