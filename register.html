{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                    <p class="text-muted small">Join NexusDonate as a Donor, Volunteer or NGO</p>
                </div>
                
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Full Name</label>
                        <input type="text" name="name" class="form-control rounded-3" placeholder="John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Email Address</label>
                        <input type="email" name="email" class="form-control rounded-3" placeholder="user@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Password</label>
                        <input type="password" name="password" class="form-control rounded-3" placeholder="••••••••" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold small">Select Role</label>
                        <select name="role" class="form-select rounded-3" required>
                            <option value="donor">Donor</option>
                            <option value="volunteer">Volunteer</option>
                            <option value="ngo">NGO</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                        Register Account
                    </button>
                </form>

                <div class="text-center border-top pt-3">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none small">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
